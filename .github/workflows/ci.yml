name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assetly
          POSTGRES_PASSWORD: test
          POSTGRES_DB: assetly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start API
        env:
          DATABASE_URL: postgres://assetly:test@localhost:5432/assetly
          JWT_SECRET: ci-test-secret
          PORT: 4000
          NODE_ENV: development
          SEED_ADMIN_PASSWORD: admin123
        run: |
          node src/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "API is up"
              break
            fi
            echo "Waiting for API… ($i)"
            sleep 1
          done
          curl -sf http://localhost:4000/api/health || (cat /tmp/api.log; exit 1)

      - name: Create test user for isolation tests
        run: |
          TOKEN=$(curl -s -X POST http://localhost:4000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@assetly.local","password":"admin123"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          curl -s -X POST http://localhost:4000/api/admin/users \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"email":"labs.admin@assetly.local","password":"test123","name":"Labs Admin","role":"company_admin","company_id":5}'

      - name: Run tests
        env:
          TEST_API_URL: http://localhost:4000
          TEST_ADMIN_PASSWORD: admin123
        run: node --test test/

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/api.log

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
