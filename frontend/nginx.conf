server {
  listen 80;
  server_name _;

  # Hide nginx version in Server header and error pages
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;

  # ---------- Security headers ----------
  add_header X-Frame-Options           "SAMEORIGIN"                      always;
  add_header X-Content-Type-Options    "nosniff"                         always;
  add_header X-XSS-Protection          "1; mode=block"                   always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin"                    always;
  add_header Cross-Origin-Resource-Policy "same-origin"                  always;

  # Enable this block ONLY after HTTPS is configured — it breaks plain HTTP clients
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---------- API proxy ----------
  location /api/export/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:4000";
    proxy_pass $api_upstream;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:4000";
    proxy_pass $api_upstream;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Strip backend identifying headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Prevent caching of API responses
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # ---------- Static assets — long cache, fingerprinted ----------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # ---------- SPA fallback ----------
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # ---------- Block common probing paths ----------
  location ~ /\.(git|env|htaccess) {
    deny all;
    return 404;
  }
  location ~* \.(sql|log|bak|swp)$ {
    deny all;
    return 404;
  }
}
