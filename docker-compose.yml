services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetly
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: assetly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetly"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://assetly:${DB_PASSWORD}@db:5432/assetly
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      REPORT_RECIPIENTS: ${REPORT_RECIPIENTS:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4000
      NODE_ENV: production
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_ALLOW_REGISTRATION: ${VITE_ALLOW_REGISTRATION:-false}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
